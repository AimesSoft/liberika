[package]
name = "erika_capi"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["libass", "wgpu", "embedded-fallback-font", "artcnn-r8f64"]
libass = ["erika/libass"]
embedded-fallback-font = ["erika/embedded-fallback-font"]
artcnn-r8f64 = ["erika/artcnn-r8f64"]
wgpu = ["erika/wgpu"]

[dependencies]
crossbeam-channel.workspace = true
erika = { path = "../erika", default-features = false }
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk = { version = "0.9.0", default-features = false, features = ["nativewindow"] }
