[package]
name = "erika_texture_host"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this host's wgpu 26 dependencies out of the engine workspace.
[workspace]

[features]
libass = ["erika/libass"]

[dependencies]
anyhow = "1"
erika = { path = "../../crates/erika", default-features = false, features = ["wgpu"] }
pollster = "0.4"
png = "0.17"
serde_json = "1"
wgpu = "=26.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
foreign-types = "0.5"

[patch.crates-io]
wgpu-hal-host = { package = "wgpu-hal", path = "../../target/host-wgpu-hal-26" }
wgpu-hal-erika = { package = "wgpu-hal", path = "../../third_party/wgpu-hal" }

[profile.dev]
debug = 1
