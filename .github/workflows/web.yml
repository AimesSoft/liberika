name: Browser backend
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/erika/**"
      - "packages/erika_web/**"
      - "scripts/*web*"
      - "examples/web_player/**"
      - "xtask/**"
      - "third_party/patches/**"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"
          actions-cache-folder: emsdk-cache
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ffmpeg
          python3 -m venv /tmp/erika-web-tools
          /tmp/erika-web-tools/bin/pip install meson
          echo /tmp/erika-web-tools/bin >> "$GITHUB_PATH"
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build complete browser package
        run: cargo run -p xtask -- web build
      - name: Core regression
        run: node --test packages/erika_web/tests/*.test.mjs
      - name: Browser regression
        run: |
          npm install --prefix target/web-tests playwright@1.58.2
          target/web-tests/node_modules/.bin/playwright install --with-deps chrome
          python3 scripts/web_test_fixtures.py
          python3 scripts/serve_web.py > target/web-server.log 2>&1 &
          PLAYWRIGHT_MODULE="$PWD/target/web-tests/node_modules/playwright/index.mjs" node packages/erika_web/tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            target/web-tests/*.json
            target/web-tests/*.png
            target/web-server.log
      - uses: actions/upload-artifact@v4
        with:
          name: liberika-web
          path: |
            target/web/**
            !target/web/fixtures/**
